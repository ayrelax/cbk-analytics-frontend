name: Update shot clock

# Rebuilds shot_clock_data from ESPN play-by-play (the same parquet hoopR reads).
#
# Three ways to run:
#  1. push    -- committing this file or the script starts a run immediately.
#                Added because the "Run workflow" button was failing to queue.
#  2. weekly  -- Mondays 09:00 UTC, about 1am Pacific.
#  3. manual  -- the Actions tab, when the button is behaving.
on:
  push:
    paths:
      - '.github/workflows/update-shot-clock.yml'
      - 'scripts/update_shot_clock.py'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to rebuild, e.g. 2026 (blank = current)'
        required: false

concurrency:
  group: update-shot-clock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas pyarrow requests

      - name: Rebuild shot_clock_data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEASON: ${{ github.event.inputs.season || '2026' }}
        run: python scripts/update_shot_clock.py
