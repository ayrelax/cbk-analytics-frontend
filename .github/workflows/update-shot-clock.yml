name: Update shot clock

# Rebuilds shot_clock_data from ESPN play-by-play -- the same parquet files hoopR
# reads, fetched directly, so no R is needed.
#
# Deliberately minimal. An earlier version had a concurrency group and an input
# expression; both were removed because a run was dying at "Set up job" before
# any code executed, and neither earned its place in a job that runs weekly.
#
# Runs when this file or the script is committed, and every Monday at 09:00 UTC
# (about 1am Pacific). The season is worked out by the script itself.

on:
  push:
    paths:
      - '.github/workflows/update-shot-clock.yml'
      - 'scripts/update_shot_clock.py'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas pyarrow requests

      - name: Rebuild shot_clock_data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/update_shot_clock.py
