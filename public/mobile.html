<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg0:#12100c;--bg1:#1b1710;--bg2:#241e15;--bdr:#3a3125;--txt1:#f6f0e3;--txt2:#d8cfbc;
--txt3:#94897a;--acc:#e0be6e;--grn:#5fcf87;--red:#f08585;--amb:#f0a94a}
html{height:100%}
body{margin:0;padding:0;background:var(--bg0);color:var(--txt1);
font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
-webkit-font-smoothing:antialiased;overscroll-behavior:none;
position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden}
.hd{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(18,16,12,.94);backdrop-filter:blur(14px);
border-bottom:1px solid var(--bdr);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.hd h1{margin:0;font-size:13px;letter-spacing:2.2px;color:var(--acc);font-weight:800}
.hd .sub{font-size:11px;color:var(--txt3);margin-top:2px}
.wrap{position:fixed;left:0;right:0;top:var(--hdh,84px);bottom:var(--tbh,60px);
overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px 18px}
.bar{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
input,select{background:var(--bg2);border:1px solid var(--bdr);color:var(--txt1);border-radius:9px;
padding:9px 11px;font:14px inherit;-webkit-appearance:none;flex:1;min-width:0}
.btn{background:var(--acc);color:#1a1208;border:0;border-radius:9px;padding:9px 15px;font:700 13px inherit;flex:0 0 auto}
.card{background:var(--bg1);border:1px solid var(--bdr);border-radius:13px;margin-bottom:9px;overflow:hidden}
.row{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--bdr)}
.row:last-child{border-bottom:0}
.bar4{width:3px;height:30px;border-radius:2px;flex:0 0 auto}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:11px;color:var(--txt3)}
.num{font:700 16px ui-monospace,Menlo,monospace;color:var(--acc);text-align:right;flex:0 0 auto}
.num small{display:block;font-size:10px;color:var(--txt3);font-weight:400;letter-spacing:.4px}
.rank{width:26px;font:700 12px ui-monospace,monospace;color:var(--txt3);flex:0 0 auto}
.g{padding:11px 13px;border-bottom:1px solid var(--bdr)}
.g:last-child{border-bottom:0}
.g-t{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.g-t .bar4{height:16px}
.g-nm{font-size:14.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--txt3)}
.pill{font:800 9.5px inherit;letter-spacing:.7px;padding:3px 7px;border-radius:5px}
.p-low{background:rgba(95,207,135,.15);color:var(--grn)}
.p-med{background:rgba(240,169,74,.15);color:var(--amb)}
.p-high{background:rgba(240,133,133,.15);color:var(--red)}
.p-no{background:rgba(240,133,133,.17);color:var(--red)}
.p-chk{background:rgba(240,169,74,.15);color:var(--amb)}
.line{font:700 15px ui-monospace,Menlo,monospace;color:var(--acc)}
.tabs::after{content:'';position:absolute;left:0;right:0;top:100%;height:240px;background:rgba(18,16,12,.96);pointer-events:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
background:rgba(18,16,12,.96);backdrop-filter:blur(18px);border-top:1px solid var(--bdr);
padding-bottom:var(--tabpad,0px)}
.tab{flex:1;text-align:center;padding:7px 4px 6px;font:700 9.5px inherit;letter-spacing:1px;
color:var(--txt3);background:0;border:0}
.tab.on{color:var(--acc)}
.tab i{display:block;font-size:17px;font-style:normal;margin-bottom:1px;opacity:.85}
.note{background:var(--bg2);border-left:3px solid var(--acc);border-radius:9px;padding:10px 12px;
margin-bottom:11px;font-size:12.5px;line-height:1.55;color:var(--txt2)}
.note b{color:var(--txt1)}
.empty{text-align:center;color:var(--txt3);padding:40px 20px;font-size:13.5px;line-height:1.6}
.ld{text-align:center;color:var(--txt3);padding:34px;font-size:13px}
.sec{font:800 10px inherit;letter-spacing:1.6px;color:var(--acc);margin:14px 2px 7px}

#gate{position:fixed;inset:0;z-index:200;background:var(--bg0);display:flex;align-items:center;
justify-content:center;padding:26px;padding-top:calc(env(safe-area-inset-top) + 26px)}
.gate-box{width:100%;max-width:330px;text-align:center}
.gate-logo{font-size:44px;color:var(--acc);line-height:1;margin-bottom:14px}
.gate-t{font-size:13px;letter-spacing:2px;font-weight:800;color:var(--acc);margin-bottom:5px}
.gate-s{font-size:13px;color:var(--txt3);margin-bottom:22px}
#gate input[type=text],#gate input[type=password]{width:100%;margin-bottom:11px;padding:14px 14px;
font-size:16px;border-radius:11px;background:var(--bg2);border:1px solid var(--bdr);color:var(--txt1)}
.gate-rm{display:flex;align-items:center;gap:9px;justify-content:center;margin:4px 0 16px;
font-size:13.5px;color:var(--txt2)}
.gate-rm input{width:20px;height:20px;accent-color:#e0be6e}
.gate-btn{width:100%;padding:14px;border:0;border-radius:11px;background:var(--acc);color:#1a1208;
font:800 14px inherit;letter-spacing:1.4px}

var P5=['ACC','B10','B12','BE','SEC'];
var CONFNAME={ACC:'ACC',B10:'Big Ten',B12:'Big 12',BE:'Big East',SEC:'SEC',P12:'Pac-12',
A10:'Atlantic 10',AAC:'American',MWC:'Mountain West',MVC:'Missouri Valley',MAC:'Mid-American',
CUSA:'Conference USA',SBC:'Sun Belt',CAA:'Colonial',Ivy:'Ivy League',BW:'Big West',BSky:'Big Sky',
BSouth:'Big South',Hor:'Horizon',Metro:'Metro',SoCon:'Southern',SL:'Southland',Sum:'Summit',
UAC:'United Athletic',OVC:'Ohio Valley',Pat:'Patriot',ASUN:'ASUN',AE:'America East',NEC:'Northeast',
MEAC:'MEAC',SWAC:'SWAC',WCC:'West Coast'};
function cname(c){return CONFNAME[c]||c||'Other';}
function confRank(c){
  var i=P5.indexOf(c);
  if(i>=0)return '0'+i;
  return '1'+cname(c);
}
function gameConf(g){
  var h=g.home&&g.home.conference, a=g.away&&g.away.conference;
  if(h&&a&&h===a)return h;
  var hp=P5.indexOf(h)>=0, ap=P5.indexOf(a)>=0;
  if(hp)return h;
  if(ap)return a;
  return h||a;
}

function n1(v){return (v==null||isNaN(v))?'--':(Math.round(v*10)/10).toFixed(1);}
/* ================= FULL PLAYER CARD + COMPARABLES ================= */
/* ---- every stat in the database, grouped ---- */
var PS_SECTIONS=[
 ['Player Info',['Height','YR','Year','Num','Role','Type','Rec Rank','Conf','Games','Min %','MP','PLAYING?']],
 ['Scoring & Efficiency',['PPG','USG%','oRTG','ADJoe','Porpag','eFG%','TS%']],
 ['Shooting',['FGA','2pM','2pA','2p%','2pa','3PM','3PA','3P%','3pa','3pR','3p/100','3PM / G','FTM','FTA','FT%','FTR']],
 ['Playmaking & Rebounding',['APG','AST %','TO %','Ast/To','RPG','ORB%','DRB%','Oreb','Dreb']],
 ['Defense',['SPG','STL %','BPG','BLK %','Drtg','Adrtg','dporpag','Stops','PFR']],
 ['Advanced (BPM / GBPM)',['BPM','OBPM','DBPM','GBPM','Ogbpm','Dgbpm']],
 ['Shot Location',['Rim Made','RM + R Miss','RM/(Rm+R Miss)','Mid Made','MM + M Miss','MM/(MM+ M Miss)',
                   'Dunks Made','DNK Miss+Dnks made','DNK Made/(DM+D Miss)']]
];
var PS_PCT={'RM/(Rm+R Miss)':1,'MM/(MM+ M Miss)':1,'DNK Made/(DM+D Miss)':1};
var PS_LABEL={'RM/(Rm+R Miss)':'Rim FG%','MM/(MM+ M Miss)':'Mid FG%','DNK Made/(DM+D Miss)':'Dunk FG%',
 'RM + R Miss':'Rim Att','MM + M Miss':'Mid Att','DNK Miss+Dnks made':'Dunk Att','Type':'Hometown',
 'PLAYING?':'Status','Rec Rank':'Recruit Rk','Min %':'Min%','MP':'Minutes','YR':'Class','Year':'Season'};
function psLabel(k){return PS_LABEL[k]||k;}
function psShow(k,v){
  if(v==null||v==='')return null;
  var t=String(v).trim();
  if(t==='')return null;
  /* stored as a 0-1 fraction -> show as a percentage */
  if(PS_PCT[k]){var f=parseFloat(t);if(!isNaN(f))return (f<=1?f*100:f).toFixed(1)+'%';}
  /* already a percentage string -> keep the sign, one decimal */
  var mp=t.match(/^(-?\d+(?:\.\d+)?)\s*%$/);
  if(mp)return parseFloat(mp[1]).toFixed(1)+'%';
  /* whole-number counts stay whole; anything with a decimal rounds to one */
  if(/^-?\d+$/.test(t))return t;
  if(/^-?\d+\.\d+$/.test(t))return parseFloat(t).toFixed(1);
  /* anything else (Height 6-9, Role, Hometown, Class) stays as written */
  return t;
}
/* ---- comparison pool: Power 5 + Gonzaga ---- */
var CMP_CONF=['ACC','B10','B12','BE','SEC'];
var _pool=null,_poolLoading=false;
function psNum(v){if(v==null||v==='')return null;var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n;}
function htIn(v){ if(!v)return null; var m=String(v).match(/(\d+)\s*[-']\s*(\d+)/); if(m)return (+m[1])*12+(+m[2]);
  var n=parseFloat(v); return isNaN(n)?null:n; }
/* what makes two players comparable: size, role, workload, production, style, efficiency */
var CMP_KEYS=[
 ['Height',1.6,htIn],   /* size first -- a guard should not match a centre */
 ['MP',1.1,psNum],['USG%',1.3,psNum],
 ['PPG',1.0,psNum],['RPG',1.0,psNum],['APG',0.8,psNum],
 ['AST %',1.0,psNum],['TO %',0.7,psNum],
 ['ORB%',1.1,psNum],['DRB%',1.1,psNum],
 ['STL %',0.8,psNum],['BLK %',1.0,psNum],
 ['3pR',1.2,psNum],['FTR',0.7,psNum],
 ['eFG%',0.9,psNum],['oRTG',0.7,psNum]
];
function poolVec(a){return CMP_KEYS.map(function(k){return k[2](a[k[0]]);});}
async function loadPool(){
  if(_pool||_poolLoading)return;
  _poolLoading=true;
  var t=await SB.from('teams').select('team,conference').range(0,9999);
  var ok={};
  (t.data||[]).forEach(function(x){if(CMP_CONF.indexOf(x.conference)>=0||x.team==='Gonzaga')ok[x.team]=1;});
  var all=[],from=0;
  while(from<6000){
    var r=await SB.from('player_stats').select('player_name,team,ppg,rpg,apg,role,all_stats').range(from,from+999);
    var d=r.data||[]; all=all.concat(d);
    if(d.length<1000)break;
    from+=1000;
  }
  var pool=all.filter(function(p){
    if(!ok[p.team])return false;
    var a=p.all_stats||{};
    if(psNum(a['MP'])<12)return false;              /* too few minutes to characterise */
    var e=psNum(a['eFG%']);
    if(e!=null&&(e<20||e>100))return false;         /* drop corrupt shooting rows */
    return true;
  });
  var n=CMP_KEYS.length,mean=[],sd=[];
  for(var i=0;i<n;i++){
    var vals=pool.map(function(p){return poolVec(p.all_stats||{})[i];}).filter(function(v){return v!=null;});
    var m=vals.reduce(function(a,b){return a+b;},0)/(vals.length||1);
    var v=Math.sqrt(vals.reduce(function(a,b){return a+(b-m)*(b-m);},0)/(vals.length||1))||1;
    mean.push(m); sd.push(v);
  }
  pool.forEach(function(p){
    var raw=poolVec(p.all_stats||{});
    p._z=raw.map(function(x,i){return x==null?null:(x-mean[i])/sd[i];});
  });
  _pool={list:pool,mean:mean,sd:sd};
  _poolLoading=false;
}
function findComps(p){
  if(!_pool)return null;
  var raw=poolVec(p.all_stats||{});
  var z=raw.map(function(x,i){return x==null?null:(x-_pool.mean[i])/_pool.sd[i];});
  var out=[];
  _pool.list.forEach(function(q){
    if(q.player_name===p.player_name&&q.team===p.team)return;
    var d=0,used=0;
    for(var i=0;i<z.length;i++){
      if(z[i]==null||q._z[i]==null)continue;
      var w=CMP_KEYS[i][1];
      d+=w*(z[i]-q._z[i])*(z[i]-q._z[i]); used+=w;
    }
    if(used<6)return;
    out.push({p:q,d:Math.sqrt(d/used)});
  });
  out.sort(function(a,b){return a.d-b.d;});
  return out.slice(0,3);
}
function openPlayer(i){
  var p=_det.players[i]; if(!p)return;
  _pcur=p; renderPlayer(p);
  if(!_pool){loadPool().then(function(){if(_pcur===p)renderPlayer(p);});}
}
var _pcur=null;
function renderPlayer(p){
  var a=p.all_stats||{};
  var d=document.getElementById('pcard');
  if(!d){d=document.createElement('div');d.id='pcard';d.className='sheet sheet2';document.body.appendChild(d);}
  var sub=[a['Team']||p.team,a['Role']||p.role,a['YR'],a['Height']].filter(Boolean).join(' \u00b7 ');
  var h='<div class="sh-hd"><button class="sh-x" onclick="closePlayer()">&#10005;</button>'
   +'<div class="sh-t"><span>'+esc(p.player_name)+'</span></div>'
   +'<div class="sh-s">'+esc(sub)+'</div></div><div class="sh-b">'
   +'<div class="big3">'
   +'<div><b>'+n1(p.ppg)+'</b><span>PPG</span></div>'
   +'<div><b>'+n1(p.rpg)+'</b><span>RPG</span></div>'
   +'<div><b>'+n1(p.apg)+'</b><span>APG</span></div></div>';
  var shown=0;
  PS_SECTIONS.forEach(function(sec){
    var inner='';
    sec[1].forEach(function(k){
      var v=psShow(k,a[k]); if(v==null)return;
      shown++;
      inner+='<div class="pg"><span>'+esc(psLabel(k))+'</span><b>'+esc(v)+'</b></div>';
    });
    if(inner)h+='<div class="sec">'+esc(sec[0])+'</div><div class="card pgrid">'+inner+'</div>';
  });
  h+='<div class="sec">COMPARABLE PLAYERS <span class="sec-n">power 5 + Gonzaga</span></div>';
  if(!_pool){h+='<div class="ld">Finding comparables&hellip;</div>';}
  else{
    var c=findComps(p);
    if(!c||!c.length){h+='<div class="empty">Not enough data to compare.</div>';}
    else{
      h+='<div class="card">'+c.map(function(x,i){
        var q=x.p,qa=q.all_stats||{};
        var sim=Math.max(0,Math.round(100-x.d*24));
        return '<div class="row"><span class="rank">'+(i+1)+'</span>'
          +'<span class="nm"><b>'+esc(q.player_name)+'</b><span>'+esc(q.team)
          +(qa['Role']?' \u00b7 '+esc(qa['Role']):'')+(qa['Height']?' \u00b7 '+esc(qa['Height']):'')+'</span></span>'
          +'<span class="ppg">'+n1(q.ppg)+'<small>PPG</small></span>'
          +'<span class="ppg">'+n1(q.rpg)+'<small>RPG</small></span>'
          +'<span class="ppg">'+n1(q.apg)+'<small>APG</small></span>'
          +'<span class="sim">'+sim+'<small>SIM</small></span></div>';
      }).join('')+'</div>'
      +'<div class="note2"><b>How this works.</b> Sixteen measures &mdash; height, minutes, usage, scoring, rebounding, '
      +'assist and turnover rates, offensive and defensive rebound rates, steal and block rates, three-point and '
      +'free-throw rate, efficiency and offensive rating &mdash; are each converted to a standard score across the pool, '
      +'then weighted and combined into a single distance. Height and usage carry the most weight, so a guard will not '
      +'match a centre on production alone. Compared against '+_pool.list.length+' players from the Power 5 and Gonzaga '
      +'who average 10+ minutes.</div>';
    }
  }
  h+='<div class="note2">'+shown+' stats on file for this player.</div></div>';
  d.innerHTML=h;
}

function cbkDiag(){
  var d=document.getElementById('diagbox');
  if(d){d.remove();return;}
  d=document.createElement('div'); d.id='diagbox';
  d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:999;background:#000;'
    +'border:2px solid #e0be6e;border-radius:10px;padding:10px 12px;font:11px ui-monospace,Menlo,monospace;'
    +'color:#e0be6e;line-height:1.65;white-space:pre-wrap';
  var t=document.querySelector('.tabs').getBoundingClientRect();
  var pr=document.getElementById('sa-probe');
  var sa=pr?pr.offsetHeight:0;
  var vv=window.visualViewport;
  d.textContent=
    'innerHeight      '+window.innerHeight+'\n'
   +'visualViewport.h '+(vv?Math.round(vv.height):'n/a')+'\n'
   +'vv.offsetTop     '+(vv?Math.round(vv.offsetTop):'n/a')+'\n'
   +'screen.height    '+screen.height+'\n'
   +'documentElement  '+document.documentElement.clientHeight+'\n'
   +'safe-area-bottom '+sa+'\n'
   +'tabs top         '+Math.round(t.top)+'\n'
   +'tabs bottom      '+Math.round(t.bottom)+'\n'
   +'tabs height      '+Math.round(t.height)+'\n'
   +'GAP              '+Math.round(window.innerHeight-t.bottom)+'\n'
   +'standalone       '+(window.navigator.standalone===true)+'\n'
   +'devicePixelRatio '+window.devicePixelRatio;
  d.onclick=function(){d.remove();};
  document.body.appendChild(d);
}
