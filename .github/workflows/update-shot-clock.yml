name: Update from play-by-play

# Rebuilds shot_clock_data and player_shots from ESPN play-by-play -- the same
# parquet files hoopR reads, fetched directly, so no R is needed.
#
# Both scripts live in one job on purpose. GitHub's hosted runners regularly fail
# to pick jobs up ("job was not acquired by Runner of type hosted"), so asking for
# one machine beats asking for two. The second step runs even if the first fails,
# so a bad shot-clock run doesn't take player shots down with it.
#
# Daily rather than weekly: a failed run then costs a day, not a week.
# 09:00 UTC is about 1am Pacific -- after the last west-coast final.

on:
  push:
    paths:
      - '.github/workflows/update-shot-clock.yml'
      - 'scripts/update_shot_clock.py'
      - 'scripts/update_player_shots.py'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas pyarrow requests

      - name: Rebuild shot_clock_data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/update_shot_clock.py

      - name: Rebuild player_shots
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/update_player_shots.py
