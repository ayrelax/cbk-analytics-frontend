name: Update player rates

# Runs every morning at 11:00 UTC (about 3am Pacific), after the previous night's
# games have settled. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to load (blank = current)'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas pyarrow requests

      - name: Refresh player_rates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEASON: ${{ github.event.inputs.season }}
        run: python scripts/update_rates.py
